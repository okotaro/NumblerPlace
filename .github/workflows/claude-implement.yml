name: Claude Implement

on:
  issue_comment:
    types: [created]

jobs:
  implement:
    if: >
      !github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude 実装して')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude 実装して"
          claude_args: |
            --append-system-prompt "このIssueに投稿済みの直近の計画コメント（Claudeによる計画）に従って実装してください。CLAUDE.mdのTDD運用（テスト仕様書作成→失敗するテストを書く→実装して通す→リファクタリング）に従うこと。実装後はこのIssue用のブランチを作成してpushし、このIssueを参照する（Closes #<issue番号> を含む）プルリクエストを作成すること。計画コメントが見当たらない、または計画が曖昧な場合は実装せずコメントで確認してください。"
