name: バグ報告
description: 動作不具合の報告
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 現象
      description: 何が起きたか
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待される動作
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 環境（ブラウザ等）
      description: 任意
    validations:
      required: false
